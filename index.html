<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Z Project</title>
    <style>
        :root {
            --bg-color: #05050f;
            --grid-color: rgba(99, 102, 241, 0.04);
            --card-bg: linear-gradient(145deg, rgba(15, 15, 35, 0.8), rgba(5, 5, 15, 0.9));
            --card-border: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-color) 2px, transparent 2px),
                linear-gradient(90deg, var(--grid-color) 2px, transparent 2px),
                radial-gradient(circle at 50% 50%, #1e1b4b 0%, transparent 70%);
            background-size: 30px 30px, 30px 30px, 100% 100%;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 2rem 1.5rem;
            box-sizing: border-box;
        }

        .header-container {
            text-align: center;
            margin-top: 1rem;
            margin-bottom: 4rem;
            width: 100%;
        }

        h1 {
            font-size: 3.25rem;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            text-shadow: 0 0 7px #ef4444, 0 0 15px #ef4444, 0 0 30px #dc2626, 0 0 50px #991b1b;
        }

        .subtitle {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            color: #ef4444;
            margin-top: 0.75rem;
            display: block;
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
        }

        /* Lock Screen Key System UI */
        .lock-screen {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 3rem 2rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.8);
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .lock-screen h3 {
            margin: 0;
            font-size: 1.15rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #e2e8f0;
        }

        .key-input {
            width: 100%;
            background: #000;
            border: 1px solid #ef4444;
            padding: 0.8rem;
            border-radius: 8px;
            color: #fff;
            text-align: center;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }

        .lock-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 0.75rem;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
        }

        .lock-btn:hover {
            background: #ef4444;
            color: #05050f;
            box-shadow: 0 0 15px #ef4444;
        }

        /* Container Hidden Until Unlocked */
        .container {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.75rem;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        @media (min-width: 1024px) {
            .container { grid-template-columns: repeat(4, 1fr); }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 2.25rem 1.25rem 1.75rem 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.7);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card::before {
            content: '';
            position: absolute;
            top: -20px;
            right: -20px;
            width: 70px;
            height: 70px;
            border-radius: 50px;
            opacity: 0.06;
            background: var(--theme-color);
            border: 4px dashed var(--theme-color);
            transition: transform 0.6s ease, opacity 0.4s ease;
        }

        .game-graphic {
            width: 44px;
            height: 4px;
            border-radius: 2px;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
            background: var(--theme-color);
            box-shadow: 0 0 10px var(--theme-color);
        }

        .card h2 {
            margin: 0 0 1.75rem 0;
            font-size: 1.25rem;
            font-weight: 700;
            color: #e2e8f0;
            min-height: 3rem;
            display: flex;
            align-items: center;
        }

        .btn {
            color: var(--theme-color);
            text-decoration: none;
            padding: 0.65rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
            display: inline-block;
            margin-top: auto;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--theme-color);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8), 0 0 25px var(--glow-color);
        }
        
        .card:hover::before {
            transform: scale(1.4) rotate(25deg);
            opacity: 0.15;
        }

        .card:hover .game-graphic { 
            width: 60px; 
        }

        .card:hover .btn { 
            background: var(--theme-color); 
            color: #05050f; 
            box-shadow: 0 0 15px var(--theme-color); 
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>A-Z Project</h1>
        <span class="subtitle">made by #1 bills glazer</span>
    </div>

    <!-- Password Input UI Box -->
    <div class="lock-screen" id="lockGate">
        <h3>System Access Required</h3>
        <input type="password" class="key-input" id="keyField" placeholder="Enter Password...">
        <button class="lock-btn" onclick="verifyKey()">Unlock</button>
    </div>

    <!-- Main Arcade Portal -->
    <div class="container" id="gameGrid">
        <!-- Game 1: Football Bros -->
        <div class="card" style="--theme-color: #00f2fe; --glow-color: rgba(0, 242, 254, 0.25);">
            <div class="game-graphic"></div>
            <h2>Football Bros</h2>
            <a href="game1/index.html" class="btn">Play Game</a>
        </div>

        <!-- Game 2: Retro Bowl -->
        <div class="card" style="--theme-color: #f107a3; --glow-color: rgba(241, 7, 163, 0.25);">
            <div class="game-graphic"></div>
            <h2>Retro Bowl</h2>
            <a href="game2/index.html" class="btn">Play Game</a>
        </div>

        <!-- Game 3: Basketball Bros -->
        <div class="card" style="--theme-color: #ff6b00; --glow-color: rgba(255, 107, 0, 0.25);">
            <div class="game-graphic"></div>
            <h2>Basketball Bros</h2>
            <a href="game3/index.html" class="btn">Play Game</a>
        </div>

        <!-- Game 4: Drive Mad -->
        <div class="card" style="--theme-color: #22c55e; --glow-color: rgba(34, 197, 94, 0.25);">
            <div class="game-graphic"></div>
            <h2>Drive Mad</h2>
            <a href="game4/index.html" class="btn">Play Game</a>
        </div>
        <!-- Game 5: Block Blast -->
        <div class="card" style="--theme-color: #a855f7; --glow-color: rgba(168, 85, 247, 0.25);">
            <div class="game-graphic"></div>
            <h2>Block Blast</h2>
            <a href="game5/index.html" class="btn">Play Game</a>
        </div>
        <!-- Game 6: Geometry Dash -->
        <div class="card" style="--theme-color: #facc15; --glow-color: rgba(250, 204, 21, 0.25);">
            <div class="game-graphic"></div>
            <h2>Geometry Dash</h2>
            <a href="game6/index.html" class="btn">Play Game</a>
        </div>
        <!-- Game 7: Eaglercraft -->
        <div class="card" style="--theme-color: #22c55e; --glow-color: rgba(34, 197, 94, 0.25);">
            <div class="game-graphic"></div>
            <h2>Eaglercraft</h2>
            <a href="game7/index.html" class="btn">Play Game</a>
        </div>
        
    </div>

    <script>
        const lockGate = document.getElementById('lockGate');
        const gameGrid = document.getElementById('gameGrid');
        const keyField = document.getElementById('keyField');

        function openPortal() {
            lockGate.style.display = 'none';
            gameGrid.style.display = 'grid';
        }

        // Keep it unlocked if they already typed the password
        if (localStorage.getItem('unlocked_arcade') === 'true') {
            openPortal();
        }

        function verifyKey() {
            if (keyField.value === "BillsMafia") {
                localStorage.setItem('unlocked_arcade', 'true');
                openPortal();
            } else {
                alert('Incorrect password entry!');
                keyField.value = '';
                keyField.focus();
            }
        }

        keyField.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                verifyKey();
            }
        });
    </script>

</body>
</html>
