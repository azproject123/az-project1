<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Az-Project</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 50px;
        }
        h1 { margin-bottom: 40px; color: #00ffcc; }
        .hub-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        .game-card {
            background-color: #2a2a2a;
            border: 2px solid #444;
            border-radius: 12px;
            padding: 30px;
            width: 200px;
            text-decoration: none;
            color: white;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00ffcc;
            box-shadow: 0 8px 16px rgba(0, 255, 204, 0.2);
            background-color: #333;
        }
    </style>
</head>
<body>
    
    <h1>Welcome to Az-Project</h1>
    <p></p>

    <div class="hub-container">
        <!-- These paths point directly to the folders you created -->
        <a href="game1/index.html" class="game-card">Football Bros</a>
        <a href="game2/index.html" class="game-card">Retro Bowl</a>
    </div>

</body>
</html>
