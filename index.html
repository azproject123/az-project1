<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Z Project</title>
    <style>
        :root {
            --bg-color: #05050f;
            --grid-color: rgba(99, 102, 241, 0.04);
            --card-bg: linear-gradient(145deg, rgba(15, 15, 35, 0.8), rgba(5, 5, 15, 0.9));
            --card-border: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-muted: #64748b;
            
            /* Game Themes with Bright Cyber-Arcade Palettes */
            --game1-color: #00f2fe;
            --game1-glow: rgba(0, 242, 254, 0.25);
            
            --game2-color: #f107a3;
            --game2-glow: rgba(241, 7, 163, 0.25);
            
            --game3-color: #ff6b00;
            --game3-glow: rgba(255, 107, 0, 0.25);

            --game4-color: #22c55e;
            --game4-glow: rgba(34, 197, 94, 0.25);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            /* Cyber Grid Background */
            background-image: 
                linear-gradient(var(--grid-color) 2px, transparent 2px),
                linear-gradient(90deg, var(--grid-color) 2px, transparent 2px),
                radial-gradient(circle at 50% 50%, #1e1b4b 0%, transparent 70%);
            background-size: 30px 30px, 30px 30px, 100% 100%;
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Aligns layout elements from the top down */
            min-height: 100vh;
            overflow-x: hidden;
            padding: 2rem 1.5rem;
            box-sizing: border-box;
        }

        /* Pushed Header To Extreme Top */
        .header-container {
            text-align: center;
            margin-top: 1rem;
            margin-bottom: 4rem;
            position: relative;
            width: 100%;
        }

        h1 {
            font-size: 3.25rem;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #ffffff;
            /* Creative Crimson Red Neon Glow */
            text-shadow: 
                0 0 7px #ef4444,
                0 0 15px #ef4444,
                0 0 30px #dc2626,
                0 0 50px #991b1b;
        }

        .subtitle {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            color: #ef4444;
            margin-top: 0.75rem;
            display: block;
            opacity: 0.8;
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
        }

        /* Balanced Dynamic Layout Grid */
        .container {
            display: grid;
            /* Flexibly sizes and shifts content blocks together dynamically */
            grid-template-columns: repeat(auto-fit, minmax(200px, 220px));
            gap: 2.5rem;
            justify-content: center;
            align-content: center;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        /* Compact Creative Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 2.25rem 1.25rem 1.75rem 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.7);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Dynamic Decorative Graphic Badges Inside Cards */
        .card::before {
            content: '';
            position: absolute;
            top: -20px;
            right: -20px;
            width: 70px;
            height: 70px;
            border-radius: 50px;
            opacity: 0.06;
            transition: transform 0.6s ease, opacity 0.4s ease;
        }
        .card-g1::before { background: var(--game1-color); border: 4px dashed var(--game1-color); }
        .card-g2::before { background: var(--game2-color); border: 4px double var(--game2-color); }
        .card-g3::before { background: var(--game3-color); border: 4px dotted var(--game3-color); }
        .card-g4::before { background: var(--game4-color); border: 4px dashed var(--game4-color); }

        /* Minimalist Abstract Graphic Blocks */
        .game-graphic {
            width: 44px;
            height: 4px;
            border-radius: 2px;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }
        .card-g1 .game-graphic { background: var(--game1-color); box-shadow: 0 0 10px var(--game1-color); }
        .card-g2 .game-graphic { background: var(--game2-color); box-shadow: 0 0 10px var(--game2-color); }
        .card-g3 .game-graphic { background: var(--game3-color); box-shadow: 0 0 10px var(--game3-color); }
        .card-g4 .game-graphic { background: var(--game4-color); box-shadow: 0 0 10px var(--game4-color); }

        .card h2 {
            margin: 0 0 1.75rem 0;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #e2e8f0;
        }

        /* Clean Mini-Buttons with Inset Glow effects */
        .btn {
            color: white;
            text-decoration: none;
            padding: 0.65rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
            display: inline-block;
            margin-top: auto;
            border: 1px solid transparent;
        }

        /* Interactive Hover & Glow Designs */
        .card-g1:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--game1-color);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8), 0 0 25px var(--game1-glow);
        }
        .card-g1:hover .game-graphic { width: 60px; }
        .card-g1 .btn { background: rgba(0, 242, 254, 0.1); border-color: rgba(0, 242, 254, 0.3); color: var(--game1-color); }
        .card-g1 .btn:hover { background: var(--game1-color); color: #000; box-shadow: 0 0 15px var(--game1-color); }

        .card-g2:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--game2-color);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8), 0 0 25px var(--game2-glow);
        }
        .card-g2:hover .game-graphic { width: 60px; }
        .card-g2 .btn { background: rgba(241, 7, 163, 0.1); border-color: rgba(241, 7, 163, 0.3); color: var(--game2-color); }
        .card-g2 .btn:hover { background: var(--game2-color); color: white; box-shadow: 0 0 15px var(--game2-color); }

        .card-g3:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--game3-color);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8), 0 0 25px var(--game3-glow);
        }
        .card-g3:hover .game-graphic { width: 60px; }
        .card-g3 .btn { background: rgba(255, 107, 0, 0.1); border-color: rgba(255, 107, 0, 0.3); color: var(--game3-color); }
        .card-g3 .btn:hover { background: var(--game3-color); color: white; box-shadow: 0 0 15px var(--game3-color); }

        .card-g4:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--game4-color);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8), 0 0 25px var(--game4-glow);
        }
        .card-g4:hover .game-graphic { width: 60px; }
        .card-g4 .btn { background: rgba(34, 197, 94, 0.1); border-color: rgba(34, 197, 94, 0.3); color: var(--game4-color); }
        .card-g4 .btn:hover { background: var(--game4-color); color: white; box-shadow: 0 0 15px var(--game4-color); }

        .card:hover::before {
            transform: scale(1.8) translate(-10px, 10px);
            opacity: 0.12;
        }

        @media (max-width: 750px) {
            .container { gap: 1.5rem; }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>A-Z Project</h1>
        <span class="subtitle">Pick a game</span>
    </div>

    <div class="container">
        <!-- Game 1 Card -->
        <div class="card card-g1">
            <div class="game-graphic"></div>
            <h2>Football Bros</h2>
            <a href="./game1/" class="btn">Play</a>
        </div>

        <!-- Game 2 Card -->
        <div class="card card-g2">
            <div class="game-graphic"></div>
            <h2>Retro Bowl</h2>
            <a href="./game2/" class="btn">Play</a>
        </div>

        <!-- Game 4 Card -->
        <div class="card card-g4">
            <div class="game-graphic"></div>
            <h2>Drive mad</h2>
            <a href="./game4/" class="btn">Play</a>
        </div>
    </div>

</body>
</html>
